# Fly.io config for the "PDR, visualized" backend.
#   fly launch --no-deploy   # first time: creates the app, keep this file
#   fly deploy               # builds the Dockerfile and ships it
#
# Bump [[vm]] for more grunt: the parallel (PS-PDR) and decompositional (PD-PDR)
# variants use multiple cores, so more CPUs genuinely pushes bigger instances.
app = "pdr-visualized"
primary_region = "syd"   # pick one near you / your users

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"   # scale to zero when idle (cheap); wakes on request
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "get"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "performance-2x"   # 2 vCPU / 4 GB. Go performance-4x/8x for the heaviest runs.
  memory = "4gb"
